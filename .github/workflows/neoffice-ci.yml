# //// Neoffice — added file (no upstream equivalent)
# Why: upstream runs its quality gate (`cargo xtask ci`: format, clippy without warnings, tests,
# asset attribution, layering, wasm) on the author's machine only, and the maintainer's Mac has too
# little disk to do it for every change. This runs the same gate on a GitHub runner, by hand or on
# a push to version-15 that touches code. Upstream's own workflows are disabled on this fork.
name: Neoffice CI

on:
  workflow_dispatch:
  push:
    branches: [version-15]
    # //// Neoffice — the interface translations moved out of the repository in v0.14.0 (craft-i18n.rev names their commit):
    # a move of that pin changes what the tests see.
    paths: ["crates/**", "apps/**", "xtask/**", "Cargo.toml", "Cargo.lock", "craft-i18n.rev", ".github/workflows/neoffice-ci.yml"]

permissions:
  contents: read

env:
  # As upstream's own gate (ci.yml, v0.14.0): the craft-fonts commit its release embeds, so the layout tests see the
  # fonts a release build has (an optional build input, crates/fonts/build.rs).
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83

concurrency:
  group: neoffice-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: cargo xtask ci
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
      # //// Neoffice — the interface translations are not in the repository since v0.14.0: they are an input of the build
      # (crates/ui-egui/build.rs reads CRAFT_I18N_DIR), at the commit craft-i18n.rev names. Upstream's gate does this with its
      # own shared action (storytold/craft-common-actions, tracked at @main); this fork only allows the actions it lists, so
      # the same two steps are written out. With CRAFT_I18N_REQUIRED=1 a build without them fails instead of showing English.
      - name: Read craft-i18n.rev
        id: i18n
        run: |
          set -euo pipefail
          rev=$(tr -d '[:space:]' < craft-i18n.rev)
          if ! [[ "$rev" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=craft-i18n.rev::expected one 40-character craft-i18n commit SHA, found '$rev'"
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: Check out craft-i18n
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-i18n
          ref: ${{ steps.i18n.outputs.rev }}
          path: craft-i18n
      - name: Build with the interface translations
        run: |
          echo "CRAFT_I18N_DIR=${GITHUB_WORKSPACE}/craft-i18n" >> "$GITHUB_ENV"
          echo "CRAFT_I18N_REQUIRED=1" >> "$GITHUB_ENV"
      - name: Linux build dependencies (winit, wgpu, rfd, audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: neoffice-ci
      - name: Quality gate
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          # As upstream's gate (craft-common-actions gate.yml, `require-craft-fonts`): two tests of v0.14.0 panic without the
          # fonts, so a build that silently drops them fails here as it would in a release.
          CRAFT_FONTS_REQUIRED: "1"
        run: cargo xtask ci
