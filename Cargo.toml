[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/wordcraft", "apps/wordcraft-cli", "xtask"]

[workspace.package]
version = "0.18.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/wordcraft"

[workspace.dependencies]
# internal
wordcraft-geom = { path = "crates/geom" }
wordcraft-doc = { path = "crates/doc" }
wordcraft-fonts = { path = "crates/fonts" }
wordcraft-layout = { path = "crates/layout" }
wordcraft-docx = { path = "crates/docx" }
wordcraft-docbin = { path = "crates/docbin" }
wordcraft-formats = { path = "crates/formats" }
wordcraft-render = { path = "crates/render" }
wordcraft-pdf = { path = "crates/pdf" }
# Proofing is craft-libs' craft-proof (it was crates/proof); its Language data is craft-i18n's
# language-data/, embedded from CRAFT_I18N_DIR (craft-i18n.rev). The package keeps the
# `wordcraft-proof` name here so `wordcraft_proof::` paths are unchanged.
# craft-proof is storytold/craft-libs main at the merge of #590 (ca-ES-valencia reads the ca-valencia
# pack), after #589 (French elision suggestions first) and #497 (flag-based compounding), which also
# has #496 (review follow-ups, en-AU) and the merged #482–#490/#495 stack; the font store's
# `language-pack` kind is #486 (CP4.1).
# //// Neoffice — craft-proof comes from Neoffice's craft-libs fork (version-15), not upstream's: the fork's craft-proof is upstream's
# `01315d9` plus the changes NeoDoc needs for French in a browser build, all generic, one commit each: dictionaries a program carries
# inside itself (`embedded::embed_dictionary`, nothing read from a folder, nothing downloaded), the affix engine's `watts`, `L'ALLEMAGNE`
# and KEEPCASE-homonym fixes, `km²` and `l'OTAN`, suggestions with an elision to correct, and French repeated-word and spacing checks.
# To follow upstream's craft-proof, merge it into the fork and move this revision; drop the fork's commits when upstream has them.
wordcraft-proof = { package = "craft-proof", git = "https://github.com/bvisible/craft-libs", rev = "2cc39ca32d6df52d8e81e7a2e21d4c3ff3550170", version = "=0.1.0" }
craft-font-store = { git = "https://github.com/storytold/craft-libs", rev = "762a06a4c6b48b522b7d4de84a87917ef90265e6", version = "=0.1.0" }
craft-font-catalog = { git = "https://github.com/storytold/craft-libs", rev = "762a06a4c6b48b522b7d4de84a87917ef90265e6", version = "=0.1.0" }
wordcraft-engine = { path = "crates/engine" }
wordcraft-mcp = { path = "crates/mcp" }
wordcraft-zotero = { path = "crates/zotero" }
wordcraft-control-key = { path = "crates/control-key" }
wordcraft-ui-egui = { path = "crates/ui-egui" }
wordcraft-metafile = { path = "crates/metafile" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
proptest = "1"
rayon = "1"
unicode-bidi = "0.3"
unicode-segmentation = "1"
unicode-linebreak = "0.1"
unicode-script = "0.5"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta", "nfa-pikevm", "unicode"] }

# text / rendering / formats
skrifa = "0.47"
harfrust = "0.13"
# WOFF / WOFF2 web fonts added by the user (#582): pure Rust (MIT); its brotli and zlib decoders
# (brotli-decompressor, flate2) are already in the tree.
wuff = "0.2.9"
# WOFF2's brotli stream, decoded ahead of wuff so its glyph point counts are checked first (#3703).
# The same crate and version wuff already decodes it with (no new code in the build): pure Rust,
# `forbid(unsafe_code)` in its default build, no_std-capable (builds for wasm), BSD-3-Clause/MIT.
brotli-decompressor = "5"
vello_cpu = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", version = "=0.1.0", default-features = false, features = ["write"] }
# craft-update: app-specific pretend versions apply to startup and manual checks.
craft-update = { git = "https://github.com/storytold/craft-libs", version = "=0.1.0", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b", features = ["egui"] }
quick-xml = "0.41"
zip = { version = "3", default-features = false, features = ["deflate"] }
# zlib streams (compressed metafile pictures in `.doc` drawings); already in the lock as a dependency of other crates.
miniz_oxide = "0.9"
cfb = "0.15"
# Legacy text encodings (GBK/GB18030, Big5, Shift_JIS, EUC-KR, single-byte code pages) for plain
# text and CSV recipient lists (#778): encoding_rs ((Apache-2.0 OR MIT) AND BSD-3-Clause) and its
# detector chardetng (Apache-2.0 OR MIT), both pure Rust (Firefox's).
encoding_rs = "0.8"
chardetng = "1"
# Password-protected (agile-encrypted) Word documents: pure-Rust RustCrypto primitives.
aes = "0.9"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
getrandom = "0.3"
zeroize = "1"
# Unix open flags (O_NONBLOCK for the engine's checked file reads, #3666); already in the lock as a
# dependency of other crates.
libc = "0.2"

# time

# ui
egui = "0.37"
egui_extras = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false }
egui_kittest = "0.37"
# A monotonic clock that works on native and in the browser (`performance.now()`).
web-time = "1.1"
rfd = "0.17"
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

# //// Neoffice — the Nora assistant pane (crates/ui-egui/src/nora_pane.rs). Neoffice's craft-libs fork
# carries Nora's client core and its egui panel. Both depend on egui only (the same 0.36 as here), so
# upstream's craft-libs types are not duplicated. To follow upstream's craft-libs later, merge it into
# the fork and move this revision; nothing else changes.
# //// Neoffice — revision da21317 (craft-libs version-15, 23.10.2026): the Stop, Undo offered only for what Nora
# changed, replies that stay in view, connection errors in the app's language (`NoraPanel::with_error_words`), the
# file id a hosting page names (`DocumentInfo::file_id`), where a link Nora wrote may lead (`links::web_or_mail`), the
# cards and the links of the conversation, print and the document's PDF for an e-mail draft (`doc_print`,
# `doc_export_pdf`, `Output::Open`).
# //// Neoffice — da21317: a reply's links to the instance on a row of their own under its words.
# //// Neoffice — 4945194 (23.10.2026): a card that asks for a choice (the mailbox to write an e-mail draft from), answered through
# the pane's own door, and the document's file handed for an e-mail draft (`doc_export_file`).
# //// Neoffice — d04a313 (23.10.2026): Nora's little Markdown drawn in her bubbles, not printed (bold, italic, code, lists).
# //// Neoffice — 72445c1 (23.10.2026): with no bold face of the app (`bold_family: None`), her bold words drawn twice a pixel apart.
# //// Neoffice — 5ffc07c (24.10.2026): the fork's merge of upstream craft-libs main 7895f5e (the Nora crates' API unchanged),
# and 548a214: an appointment card (`Event`) is answered yes or no in the pane.
# //// Neoffice — 4f48d82 (24.10.2026): a turn is not given up on the clock alone, and a late answer shows as it comes
# (a tab in the background); the panel builds on egui 0.36 or 0.37 (the editors keep 0.36, the one their lock has).
# //// Neoffice — 1f01bcc (24.10.2026): a request lost to a tab in the background is offered again (Resume, on the click
# only), an action of a turn given up on never plays later, the links of a long reply are read in linear time.
# //// Neoffice — 620d408 (24.10.2026): an action addressed to another conversation or document is refused, a reply of a
# turn that could not act in time is corrected (CorrectionWords), a card after the final reply is still read.
# //// Neoffice — 1ff4e9a (24.10.2026): a long action of Nora's (the editor busy for a while) is no tab in the background.
# //// Neoffice — 4d7eea6 (27.10.2026): Nora's button at the top of the editor (launcher, aa432bc, d9fc6e0), and the
# pane's words readable on a dark pane (its text, weak words and buttons not usable yet above 4.5:1).
# //// Neoffice — 7bc770d (05.11.2026): the pane in the Neoffice design system (paper, ink, Karla and Forum, Lucide, Nora's
# sphere), what Nora is doing in words, a microphone to dictate (`nora_dictation`), reads of her actions that follow what
# happens in the turn, and a clock that runs while the window is hidden (`drive`, pumped from `logic`). egui 0.37 only.
# //// Neoffice — 3247387 (05.11.2026): a microphone whose audio context a browser starts on a gesture still hears, and the sphere is drawn 12 times a second.
craft-nora = { git = "https://github.com/bvisible/craft-libs", rev = "324738706bc87d5cb8d87ab19414fd19c15eef34" }
craft-nora-ui = { git = "https://github.com/bvisible/craft-libs", rev = "324738706bc87d5cb8d87ab19414fd19c15eef34" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
cognitive_complexity = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "deny"
type_complexity = "allow"

# Line tables keep file and line in panics and backtraces; full debug info
# for every test binary and dependency would multiply the target dir size.
# The test profile inherits both settings.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Required by craft-pdf: the backend rejects writers that failed during unwinding.
[patch.crates-io]
krilla = { git = "https://github.com/storytold/craft-libs", rev = "6e03f65bf45181db77ba6229716e6624db9eb25b" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
